{% extends "base/base.html" %}

{% block title %}Edit Address{% endblock title %}

{% block content %}
<section class="py-5">
  <div class="container form-container">
    <h1 class="mb-3">Edit Address</h1>
    <form method="post" class="row g-3">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="col-12">
        <button type="submit" class="btn btn-brand">Update address</button>
      </div>
    </form>
  </div>
</section>
{% endblock content %}
