{% extends "base/base.html" %}
{% block title %}Edit Post{% endblock title %}
{% block content %}
    <section class="py-5">
        <div class="container" style="max-width: 640px;">
            <h1 class="h4 mb-4">Edit Post</h1>
            <div class="hero-card p-4">
                <form method="post" enctype="multipart/form-data" class="d-flex flex-column gap-3">
                    {% csrf_token %}
                    {{ form.body }}
                    {% if post.image %}
                        <img src="{{ post.image.url }}" class="rounded" style="max-height: 220px; object-fit: cover;" alt="Current image">
                    {% endif %}
                    <div>{{ form.image.label_tag }}{{ form.image }}</div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-brand">Save changes</button>
                        <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
{% endblock content %}
