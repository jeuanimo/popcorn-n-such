{% extends "base/base.html" %}
{% block title %}
    Continue To Payment
{% endblock title %}
{% block content %}
    <section class="py-5">
        <div class="container">
            <div class="hero-card p-4 p-md-5 text-center">
                <h1 class="h4 mb-3">Continue To {{ provider_label }}</h1>
                <p class="text-muted mb-4">You are leaving Popcorn-N-Such to complete secure payment with our provider.</p>
                <a class="btn btn-brand btn-lg" href="{{ checkout_url }}" rel="noopener">Continue To Secure Payment</a>
                <div class="mt-3">
                    <a class="btn btn-link" href="{% url 'orders:checkout-review' %}">Back To Order Review</a>
                </div>
            </div>
        </div>
    </section>
{% endblock content %}
