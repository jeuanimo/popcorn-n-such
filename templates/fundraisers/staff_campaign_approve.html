{% extends "base/base.html" %}

{% block title %}Approve Campaign{% endblock title %}

{% block content %}
<section class="py-5">
  <div class="container form-container">
    <div class="hero-card p-4 p-md-5">
      <h1 class="h4 mb-2">Approve Campaign</h1>
      <p class="text-muted mb-3">{{ campaign.campaign_name }} ({{ campaign.organization.name }})</p>
      <form method="post" class="row g-3">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="col-12">
          <button class="btn btn-brand" type="submit">Save approval decision</button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock content %}
