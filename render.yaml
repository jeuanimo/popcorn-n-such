##############################################################################
# Render.com infrastructure definition
# https://render.com/docs/blueprint-spec
##############################################################################

services:
  - type: web
    name: popcorn-n-such
    runtime: python
    region: ohio
    plan: starter
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --threads 2
      --worker-class gthread
      --timeout 120
      --access-logfile -
      --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: popcorn-n-such.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://popcorn-n-such.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: popcorn-n-such-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: popcorn-n-such-redis
          type: redis
          property: connectionString
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_LOG_LEVEL
        value: WARNING
      - key: SITE_BASE_URL
        value: https://popcorn-n-such.onrender.com
      # Add remaining secrets via Render dashboard or render.yaml envVars:
      # CLOUDINARY_URL, PAYMENTS_WEBHOOK_SECRET, SHIPPO_API_KEY, SENTRY_DSN, etc.
      # See .env.example for the full list.

  - type: worker
    name: popcorn-n-such-worker
    runtime: python
    region: ohio
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info --concurrency 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        fromService:
          name: popcorn-n-such
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: popcorn-n-such-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: popcorn-n-such-redis
          type: redis
          property: connectionString
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: popcorn-n-such.onrender.com
      - key: SITE_BASE_URL
        value: https://popcorn-n-such.onrender.com

  - type: worker
    name: popcorn-n-such-beat
    runtime: python
    region: ohio
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      celery -A config beat -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        fromService:
          name: popcorn-n-such
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: popcorn-n-such-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: popcorn-n-such-redis
          type: redis
          property: connectionString
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: popcorn-n-such.onrender.com
      - key: SITE_BASE_URL
        value: https://popcorn-n-such.onrender.com

  - type: redis
    name: popcorn-n-such-redis
    region: ohio
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # internal access only

databases:
  - name: popcorn-n-such-db
    databaseName: popcorn_n_such
    region: ohio
    plan: starter
